name: Publish NuGet

on:
  push:
    tags: [ 'v*' ]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore src/DesignPatterns.sln

      - name: Build
        run: dotnet build src/DesignPatterns.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/DesignPatterns.sln --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/DesignPatterns/DesignPatterns.csproj --configuration Release --no-build --output ./nupkg

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
