name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore src/DesignPatterns.sln

      - name: Build
        run: dotnet build src/DesignPatterns.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/DesignPatterns.sln --configuration Release --no-build --verbosity normal
