name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: [ '8.0.x', '9.0.x' ]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore src/DesignPatterns.sln

      - name: Build
        run: dotnet build src/DesignPatterns.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/DesignPatterns.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
